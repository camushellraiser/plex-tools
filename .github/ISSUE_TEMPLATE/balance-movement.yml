name: "Balance · Registrar movimiento"
description: "Confirma un cargo o abono para el Balance Compartido (solo el propietario puede guardarlo)."
title: "[Balance] Nuevo movimiento"
body:
  - type: markdown
    attributes:
      value: |
        Este formulario recibe los datos del dashboard Balance Compartido. Confirma los campos y pulsa **Submit new issue**. La automatización actualizará el saldo. Solo se procesarán los formularios creados por la cuenta propietaria `camushellraiser`.
  - type: input
    id: tipo
    attributes:
      label: Tipo de movimiento
      description: Se rellena desde el dashboard: Cargo aumenta el saldo, Abono lo disminuye.
      placeholder: "Cargo o Abono"
    validations:
      required: true
  - type: input
    id: importe
    attributes:
      label: Importe MXN
      description: Cantidad positiva en pesos, hasta dos decimales.
      placeholder: "1500.00"
    validations:
      required: true
  - type: input
    id: fecha
    attributes:
      label: Fecha
      description: Usa el formato AAAA-MM-DD.
      placeholder: "2026-11-20"
    validations:
      required: true
  - type: input
    id: concepto
    attributes:
      label: Concepto
      placeholder: "Ej. Pago de colegiatura"
    validations:
      required: true
  - type: textarea
    id: nota
    attributes:
      label: Nota
      description: Opcional. Evita información personal confidencial.
      placeholder: "Detalle adicional (opcional)"
    validations:
      required: false
